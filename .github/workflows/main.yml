name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Move App Folder to Root
      run: |
        if [ -d ".github/workflows/app" ]; then
          echo "Copying app folder to root..."
          cp -r .github/workflows/app ./app
        fi
        echo "Root folders:"
        ls -la
        echo "App contents:"
        ls -la app/

    - name: Apply Compiler Bug Fixes
      run: |
        echo "Applying patches..."
        sed -i 's/catch (_: Exception)/catch (e: Exception)/g' app/src/main/java/com/mratubhayas/app/receiver/NiyamAlarmReceiver.kt
        sed -i 's/progress = { progress }/progress = progress/g' app/src/main/java/com/mratubhayas/app/ui/SadhanaScreen.kt
        sed -i 's/progress = { totalProgress }/progress = totalProgress/g' app/src/main/java/com/mratubhayas/app/ui/SadhanaScreen.kt
        sed -i '/showOnLockScreen/d' app/src/main/AndroidManifest.xml
        sed -i '/windowShowWhenLocked/d' app/src/main/res/values/themes.xml
        sed -i '/windowTurnScreenOn/d' app/src/main/res/values/themes.xml
        sed -i '/windowKeepScreenOn/d' app/src/main/res/values/themes.xml
        sed -i 's/Icons.Default.TrackChanges/Icons.Default.Star/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt
        sed -i 's/Icons.Default.CalendarMonth/Icons.Default.DateRange/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt
        sed -i 's/Icons.Default.SelfImprovement/Icons.Default.PlayArrow/g' app/src/main/java/com/mratubhayas/app/ui/HomeScreen.kt
        echo "All patches applied successfully!"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: app/build/outputs/apk/debug/*.apk
