name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Move App Folder to Root
      run: |
        if [ -d ".github/workflows/app" ]; then
          echo "Copying app folder to root..."
          cp -r .github/workflows/app ./app
        fi
        echo "Root folders:"
        ls -la
        echo "App contents:"
        ls -la app/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: app/build/outputs/apk/debug/*.apk
