name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Gradle Wrapper Executable
      run: |
        chmod +x gradlew || true
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Locate APK
      run: |
        mkdir -p output_apk
        cp app/build/outputs/apk/debug/*.apk output_apk/MratuBhayas.apk || true
        ls -la output_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: output_apk/MratuBhayas.apk
        retention-days: 30
