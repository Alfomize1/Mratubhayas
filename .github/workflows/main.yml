name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        python3 -c "import zipfile, os; zipfile.ZipFile('MratuBhayasApp.zip').extractall('.') if os.path.exists('MratuBhayasApp.zip') else None"
        if [ -d ".github/workflows/app" ] && [ ! -d "app" ]; then
          echo "Copying fallback app folder to root..."
          cp -r .github/workflows/app ./app
        fi
        echo "Root directory contents:"
        ls -la
        echo "App directory contents:"
        ls -la app/

    - name: Apply Safety Patches
      run: |
        echo "Applying safety patches..."
        sed -i 's/catch (_: Exception)/catch (e: Exception)/g' app/src/main/java/com/mratubhayas/app/receiver/NiyamAlarmReceiver.kt 2>/dev/null || true
        sed -i 's/progress = { progress }/progress = progress/g' app/src/main/java/com/mratubhayas/app/ui/SadhanaScreen.kt 2>/dev/null || true
        sed -i 's/progress = { totalProgress }/progress = totalProgress/g' app/src/main/java/com/mratubhayas/app/ui/SadhanaScreen.kt 2>/dev/null || true
        sed -i '/showOnLockScreen/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
        sed -i '/windowShowWhenLocked/d' app/src/main/res/values/themes.xml 2>/dev/null || true
        sed -i '/windowTurnScreenOn/d' app/src/main/res/values/themes.xml 2>/dev/null || true
        sed -i '/windowKeepScreenOn/d' app/src/main/res/values/themes.xml 2>/dev/null || true
        sed -i 's/Icons.Default.SelfImprovement/Icons.Default.PlayArrow/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.Alarm/Icons.Default.Notifications/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.NotificationsActive/Icons.Default.Notifications/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.TrackChanges/Icons.Default.Star/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.CalendarMonth/Icons.Default.DateRange/g' app/src/main/java/com/mratubhayas/app/MainActivity.kt 2>/dev/null || true
        sed -i 's/filled.Stop/filled.Close/g' app/src/main/java/com/mratubhayas/app/ui/DhyanScreen.kt 2>/dev/null || true
        sed -i 's/Icons.Default.Stop/Icons.Default.Close/g' app/src/main/java/com/mratubhayas/app/ui/DhyanScreen.kt 2>/dev/null || true
        sed -i 's/filled.SelfImprovement/filled.PlayArrow/g' app/src/main/java/com/mratubhayas/app/ui/HomeScreen.kt 2>/dev/null || true
        sed -i 's/Icons.Default.SelfImprovement/Icons.Default.PlayArrow/g' app/src/main/java/com/mratubhayas/app/ui/HomeScreen.kt 2>/dev/null || true
        sed -i '/filled.Alarm/d' app/src/main/java/com/mratubhayas/app/ui/HomeScreen.kt 2>/dev/null || true
        sed -i '/filled.CheckCircle/d' app/src/main/java/com/mratubhayas/app/ui/HomeScreen.kt 2>/dev/null || true
        sed -i '/filled.Alarm/d' app/src/main/java/com/mratubhayas/app/ui/NiyamScreen.kt 2>/dev/null || true
        sed -i 's/NotificationsActive/Notifications/g' app/src/main/java/com/mratubhayas/app/ui/SanskarScreen.kt 2>/dev/null || true
        sed -i 's/filled.Alarm/filled.Notifications/g' app/src/main/java/com/mratubhayas/app/AlarmAlertActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.Alarm/Icons.Default.Notifications/g' app/src/main/java/com/mratubhayas/app/AlarmAlertActivity.kt 2>/dev/null || true
        sed -i 's/filled.Snooze/filled.Refresh/g' app/src/main/java/com/mratubhayas/app/AlarmAlertActivity.kt 2>/dev/null || true
        sed -i 's/Icons.Default.Snooze/Icons.Default.Refresh/g' app/src/main/java/com/mratubhayas/app/AlarmAlertActivity.kt 2>/dev/null || true
        echo "Patches applied successfully!"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee build_output.log

    - name: Show Compiler Errors
      if: failure()
      run: |
        echo "=================== ERROR LOG SUMMARY ==================="
        grep -E "e: |error:|Compilation error" build_output.log 2>/dev/null || tail -n 60 build_output.log 2>/dev/null || true
        echo "========================================================="

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: app/build/outputs/apk/debug/*.apk
