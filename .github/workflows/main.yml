name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract ZIP if present
      run: |
        if [ -f "MratuBhayasApp.zip" ]; then
          echo "Found MratuBhayasApp.zip! Unzipping project files..."
          unzip -o MratuBhayasApp.zip
        fi
        echo "Root directory contents:"
        ls -la
        if [ -d "app" ]; then
          echo "App directory contents:"
          ls -la app/
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
