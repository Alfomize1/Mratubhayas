name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        if [ -f "MratuBhayasApp.zip" ]; then
          echo "Extracting MratuBhayasApp.zip..."
          python3 -c "
import zipfile, os
with zipfile.ZipFile('MratuBhayasApp.zip', 'r') as zf:
    for member in zf.infolist():
        clean_name = member.filename.replace('\\\\', '/').replace('\\', '/')
        target = os.path.join('.', clean_name)
        if clean_name.endswith('/'):
            os.makedirs(target, exist_ok=True)
        else:
            os.makedirs(os.path.dirname(target), exist_ok=True)
            with open(target, 'wb') as f:
                f.write(zf.read(member))
"
        fi
        echo "Root contents:"
        ls -la
        if [ -d "app" ]; then
          echo "App contents:"
          ls -la app/
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MratuBhayas-Android-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
